name: _app-deploy

# Reusable app-deploy engine: runs the solution's post-provision steps after the infra
# deployment. Rendered by the fde-cicd-app-deploy skill with the confirmed classification
# baked in. Placeholders (__…__) are substituted at generation time; the "include" steps
# below never edit the repo's Bicep/app/post-provision sources.

on:
  workflow_call:
    inputs:
      environment:
        description: "Logical stage from the Bicep params folder; selects the params file used to resolve the target resource group."
        required: true
        type: string
      gh_environment:
        description: "GitHub Environment to bind for Variables + gate (for example <stage>)."
        required: true
        type: string
      deployment_name:
        description: "Infra deployment name to read outputs from. When empty, the latest succeeded deployment in the resource group is used."
        required: false
        type: string
        default: ""
      template_file:
        required: false
        type: string
        default: infra/main.bicep
      parameters_file:
        description: "Override; defaults to infra/params/<environment>.bicepparam"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  app-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_environment }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve parameters file
        id: params
        env:
          PARAMETERS_FILE: ${{ inputs.parameters_file }}
          TEMPLATE_FILE: ${{ inputs.template_file }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          file="$PARAMETERS_FILE"
          if [ -z "$file" ]; then
            file="$(dirname "$TEMPLATE_FILE")/params/$ENVIRONMENT.bicepparam"
          fi
          if [ ! -f "$file" ]; then
            echo "::error::Parameters file '$file' not found for environment '$ENVIRONMENT'."
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Resolve target resource group
        id: target
        env:
          PARAMS_FILE: ${{ steps.params.outputs.file }}
        run: |
          rg="$(az bicep build-params --file "$PARAMS_FILE" --stdout \
            | jq -r '.parametersJson | fromjson | .parameters.resourceGroupName.value // ""')"
          if [ -z "$rg" ] || [ "$rg" = "null" ]; then
            echo "::error::Parameter 'resourceGroupName' not found in '$PARAMS_FILE'."
            exit 1
          fi
          echo "resource_group=$rg" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment name
        id: deployment
        env:
          RESOURCE_GROUP: ${{ steps.target.outputs.resource_group }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        run: |
          name="$DEPLOYMENT_NAME"
          if [ -z "$name" ]; then
            name="$(az deployment group list \
              --resource-group "$RESOURCE_GROUP" \
              --query "sort_by([?properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" \
              -o tsv)"
          fi
          if [ -z "$name" ] || [ "$name" = "None" ]; then
            echo "::error::No succeeded deployment found in resource group '$RESOURCE_GROUP'. Provide 'deployment_name' or run the infra deploy first."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Export deployment outputs to environment
        env:
          RESOURCE_GROUP: ${{ steps.target.outputs.resource_group }}
          DEPLOYMENT_NAME: ${{ steps.deployment.outputs.name }}
        run: |
          # Bridge: infra outputs -> $GITHUB_ENV. Names already match the vars the
          # post-provision scripts read; ARM lowercases keys, so upper-case them.
          # Scalars only, so array/object outputs never corrupt $GITHUB_ENV.
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs -o json \
          | jq -r '
              to_entries[]
              | select((.value.value | type) as $t | $t == "string" or $t == "number" or $t == "boolean")
              | "\(.key | ascii_upcase)=\(.value.value | tostring)"
            ' >> "$GITHUB_ENV"

      - name: Build & push application images
        env:
          RESOURCE_GROUP: ${{ steps.target.outputs.resource_group }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          bash __BUILD_SCRIPT__ --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID"

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "__PY_VERSION__"

      - name: Install post-provision dependencies
        run: |
          python -m pip install uv
          uv pip install --system -r __REQUIREMENTS__

      - name: Run post-provision
        env:
          # Input-only values (not deployment outputs) are baked in here as env: entries.
          __EXTRA_ENV__: ""
        run: |
          # stdin is fed to satisfy the entrypoint's unconditional "Press Enter" prompt;
          # --scenario avoids the interactive BYOD prompts. No script edit required.
          printf '\n' | python __POST_PROVISION_ENTRYPOINT__ __POST_PROVISION_ARGS__

      - name: Manual post-steps (reminder)
        if: always()
        run: |
          {
            echo "### App-deploy — manual post-steps"
            echo ''
            echo "__MANUAL_POST_STEPS__"
          } >> "$GITHUB_STEP_SUMMARY"
