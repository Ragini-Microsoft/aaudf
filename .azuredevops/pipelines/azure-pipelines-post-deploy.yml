# Azure DevOps - reusable post-deployment and test stage.

parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: azureEnvName
    type: string
  - name: subscriptionId
    type: string
  - name: dependsOn
    type: string
    default: Provision

stages:
  - stage: PostDeployTest
    displayName: Post-deploy and tests
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    jobs:
      - job: post_deploy
        displayName: Run post-deploy scripts
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: Download infra outputs (if published)
            continueOnError: true
            inputs:
              artifact: infra-outputs
              path: $(Pipeline.Workspace)/infra-outputs

          - task: AzureCLI@2
            displayName: Read config and hydrate azd env
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='${{ parameters.resourceGroup }}'
                AZD_ENV='${{ parameters.azureEnvName }}'
                export AZURE_SUBSCRIPTION_ID='${{ parameters.subscriptionId }}'

                ART="${PIPELINE_WORKSPACE:-$(pwd)}/infra-outputs/infra-outputs.json"
                if [ -f "$ART" ] && [ "$(tr -d '[:space:]' < "$ART")" != "{}" ] && [ -s "$ART" ]; then
                  echo "Using published infra outputs artifact: $ART"
                  cp "$ART" infra-outputs.json
                  OUTPUT_RG="$(jq -r '.AZURE_RESOURCE_GROUP.value // empty' infra-outputs.json)"
                  [ -n "$OUTPUT_RG" ] && RG="$OUTPUT_RG"
                else
                  DEP="$(az deployment group list --resource-group "$RG" \
                    --query "sort_by([?properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" \
                    -o tsv 2>/dev/null || true)"
                  if [ -z "$DEP" ] || [ "$DEP" = "None" ]; then
                    echo "No succeeded ARM deployment found in '$RG'; using an empty output set."
                    echo '{}' > infra-outputs.json
                  else
                    az deployment group show --resource-group "$RG" --name "$DEP" \
                      --query properties.outputs -o json > infra-outputs.json
                  fi
                fi

                curl -fsSL https://aka.ms/install-azd.sh | bash
                azd version
                azd auth login \
                  --client-id "$servicePrincipalId" \
                  ${servicePrincipalKey:+--client-secret "$servicePrincipalKey"} \
                  ${servicePrincipalKey:+--tenant-id "$tenantId"} \
                  ${servicePrincipalKey:---federated-credential-provider "azure-pipelines"} 1>/dev/null 2>&1 || true

                azd env new "$AZD_ENV" --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt \
                  || azd env select "$AZD_ENV"
                azd env set AZURE_RESOURCE_GROUP "$RG"

                jq -r '
                  to_entries[]
                  | select((.value.value | type) as $t | $t=="string" or $t=="number" or $t=="boolean")
                  | "\(.key | ascii_upcase)\t\(.value.value | tostring)"
                ' infra-outputs.json > kv.tsv || : > kv.tsv

                : > .env
                printf 'AZURE_RESOURCE_GROUP=%s\n' "$RG" >> .env
                while IFS="$(printf '\t')" read -r k v; do
                  [ -n "$k" ] || continue
                  azd env set "$k" "$v" || true
                  printf '%s=%s\n' "$k" "$v" >> .env
                  echo "##vso[task.setvariable variable=$k]$v"
                done < kv.tsv
                echo "##vso[task.setvariable variable=AZURE_RESOURCE_GROUP]$RG"
                echo "Hydrated $(wc -l < kv.tsv) output(s) into azd env '$AZD_ENV' and .env."

          - task: UsePythonVersion@0
            displayName: Use Python 3.11
            inputs:
              versionSpec: "3.11"

          - task: Bash@3
            displayName: Install post-deploy Python dependencies
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                python -m pip install uv
                uv pip install --system -r infra/scripts/post-provision/requirements.txt

          - task: AzureCLI@2
            displayName: Run post-deploy steps
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_ENV_NAME='${{ parameters.azureEnvName }}'
                export AZURE_RESOURCE_GROUP='$(AZURE_RESOURCE_GROUP)'
                export AZURE_SUBSCRIPTION_ID='${{ parameters.subscriptionId }}'
                run_step() {
                  runner="$1"; path="$2"; shift 2
                  if [ ! -f "$path" ]; then
                    echo "##vso[task.logissue type=error]post-deploy script '$path' not found."
                    exit 1
                  fi
                  echo "----- $runner $path $*"
                  case "$runner" in
                    bash) bash "$path" "$@" ;;
                    pwsh) pwsh -File "$path" "$@" ;;
                    python) python "$path" "$@" ;;
                    *) echo "##vso[task.logissue type=error]unknown runner '$runner' for '$path'"; exit 1 ;;
                  esac
                }
                run_step bash infra/scripts/build/build-and-push-acr.sh --resource-group "$AZURE_RESOURCE_GROUP"
                printf '\n' | run_step python infra/scripts/post-provision/00_build_solution.py
                run_step pwsh infra/scripts/post-provision/setup_app_authentication.ps1 -ResourceGroup "$AZURE_RESOURCE_GROUP"

          - task: Bash@3
            displayName: Manual post-steps (reminder)
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                {
                  echo "### Post-deploy - manual steps not run by CI"
                  echo ""
                  cat <<'REMINDER'
                - Create the Fabric Data Agent and publish it to Teams by following `documents/CopilotStudioDeployment.md`.
                - The interactive agent chat in `infra/scripts/post-provision/06_test_agent.py` is developer-only validation.
                REMINDER
                } | tee "$(Build.ArtifactStagingDirectory)/manual-post-steps.md"
                echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/manual-post-steps.md"

      - job: unit_frontend
        displayName: Unit tests (frontend)
        dependsOn: post_deploy
        condition: succeeded()
        steps:
          - checkout: self
          - task: Bash@3
            displayName: Install and test (frontend)
            inputs:
              targetType: inline
              workingDirectory: src/App
              script: |
                set -euo pipefail
                npm ci
                CI=true npm test -- --watchAll=false

      - job: unit_backend_pytest
        displayName: Unit tests (backend, pytest)
        dependsOn: post_deploy
        condition: succeeded()
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - task: Bash@3
            displayName: Install and run pytest
            inputs:
              targetType: inline
              workingDirectory: .
              script: |
                set -euo pipefail
                python -m pip install uv pytest
                uv pip install --system -r infra/scripts/post-provision/requirements.txt
                pytest

      - job: unit_backend_dotnet
        displayName: Unit tests (backend, dotnet)
        dependsOn: post_deploy
        condition: succeeded()
        steps:
          - checkout: self
          - task: Bash@3
            displayName: dotnet test
            inputs:
              targetType: inline
              workingDirectory: src/api/dotnet/tests/CsApi.Tests
              script: |
                set -euo pipefail
                dotnet test --nologo

      - job: playwright
        displayName: Playwright / e2e tests
        dependsOn:
          - unit_frontend
          - unit_backend_pytest
          - unit_backend_dotnet
        condition: succeeded()
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - task: Bash@3
            displayName: Run Playwright (python)
            inputs:
              targetType: inline
              workingDirectory: tests/e2e-test
              script: |
                set -euo pipefail
                python -m pip install uv
                uv pip install --system -r requirements.txt
                python -m playwright install --with-deps chromium
                pytest