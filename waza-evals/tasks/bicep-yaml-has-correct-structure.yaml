id: bicep-yaml-has-correct-structure
name: "Positive: Generated Bicep YAML has correct structure"
description: >-
  Verifies the generated Bicep pipeline YAML contains expected ADO structure:
  triggers, stages, variable group, service connection, schedule, cleanup.
tags:
  - bicep
  - positive
  - structure
  - yaml-content

inputs:
  prompt: >-
    This repository has Bicep infrastructure under infra/ but no CI/CD
    pipelines yet. Generate the Bicep deploy pipeline YAML
    (azure-pipelines-bicep-deploy.yml) under .azuredevops/pipelines/.
    Use "azure-service-connection" as the service connection, "bicep-deploy"
    as the variable group. Include a Cleanup stage with condition always()
    and a daily schedule at 00:00 IST. Proceed without confirmation.
  context:
    fixture: fixtures/bicep-fresh
  follow_up_prompts:
    - >-
      Show me the full content of azure-pipelines-bicep-deploy.yml that you
      generated. Print the entire YAML.

expected:
  output_contains_any:
    - "bicep-deploy"
    - "azure-service-connection"
    - "SERVICE_CONNECTION"
    - "serviceConnection"
    - "condition: always()"
    - "always()"
    - "30 18"
    - "00:00 IST"
    - "stages:"
    - "stage:"
  output_not_contains:
    - "terraform"
  behavior:
    max_tool_calls: 80
