id: cleanup-always-present
name: "Positive: Deploy pipeline has Cleanup with always()"
description: >-
  Verifies the generated deploy pipeline includes a Cleanup stage that runs
  unconditionally (condition: always()) to delete the resource group.
tags:
  - structure
  - positive
  - cleanup

inputs:
  prompt: >-
    This repository has Bicep infrastructure under infra/ but no pipelines.
    Generate the deploy pipeline YAML. The Cleanup stage MUST use
    condition: always() so the resource group is deleted even on failure.
    Place output under .azuredevops/pipelines/. Proceed without confirmation.
  context:
    fixture: fixtures/bicep-fresh
  follow_up_prompts:
    - >-
      Show me just the Cleanup stage from the deploy pipeline you generated.
      Include the condition and the az group delete command.

expected:
  output_contains_any:
    - "condition: always()"
    - "always()"
    - "condition: always"
    - "az group delete"
    - "Delete"
    - "delete"
    - "Cleanup"
  behavior:
    max_tool_calls: 80
