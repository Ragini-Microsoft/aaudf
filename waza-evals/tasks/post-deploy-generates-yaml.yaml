id: post-deploy-generates-yaml
name: "Positive: Post-deploy stage YAML generation"
description: >-
  Agent generates a post-deploy stage template that runs post-provision
  scripts and tests after infrastructure deployment.
tags:
  - post-deploy
  - positive
  - generation

inputs:
  prompt: >-
    This repository has Bicep infrastructure under infra/ but no CI/CD
    pipelines yet. Generate the complete Azure DevOps deploy pipeline
    including a PostDeployTest stage that runs post-deployment scripts
    and tests after provisioning. The post-deploy stage should read
    configuration from the resource group and run discovered scripts.
    Place all YAML under .azuredevops/pipelines/. Proceed without
    asking for confirmation.
  context:
    fixture: fixtures/bicep-fresh
  follow_up_prompts:
    - >-
      Does the deploy pipeline include a post-deploy or PostDeployTest
      stage? Describe what it does.

expected:
  output_contains_any:
    - "post-deploy"
    - "PostDeployTest"
    - "post_deploy"
    - "post-provision"
    - "after provisioning"
    - "after deployment"
  behavior:
    max_tool_calls: 80
