id: bicep-generates-yaml
name: "Positive: Bicep pipeline YAML generation"
description: >-
  Agent detects Bicep infra in a repo with NO existing pipelines and
  generates the expected YAML files under .azuredevops/pipelines/.
tags:
  - bicep
  - positive
  - generation

inputs:
  prompt: >-
    This repository has Bicep infrastructure under infra/ but no CI/CD
    pipelines yet. Generate Azure DevOps CI/CD pipeline YAML files for the
    Bicep infrastructure. Use "azure-service-connection" as the service
    connection and "bicep-deploy" as the variable group. Place all YAML
    under .azuredevops/pipelines/. Proceed without asking for confirmation.
  context:
    fixture: fixtures/bicep-fresh
  follow_up_prompts:
    - >-
      List every file you created or would create under .azuredevops/pipelines/.
      Show only the filenames, one per line.

expected:
  output_contains_any:
    - "azure-pipelines-bicep-ci"
    - "azure-pipelines-bicep-deploy"
    - "infra-validate"
    - "infra-deploy"
    - "bicep-ci"
    - "bicep-deploy"
    - ".yml"
  output_not_contains:
    - "no infrastructure"
    - "no Bicep"
  behavior:
    max_tool_calls: 80
