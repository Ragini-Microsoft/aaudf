id: post-deploy-has-correct-structure
name: "Positive: Post-deploy stage has correct structure"
description: >-
  Verifies the generated post-deploy stage has correct dependsOn chain,
  reads config from the resource group, and the Cleanup stage depends on it.
tags:
  - post-deploy
  - positive
  - structure

inputs:
  prompt: >-
    This repository has Bicep infrastructure under infra/ but no pipelines.
    Generate the deploy pipeline with three stages: Provision, PostDeployTest,
    and Cleanup. The PostDeployTest stage must depend on Provision and read
    deployment outputs from the resource group. The Cleanup stage must depend
    on both Provision and PostDeployTest with condition always(). Place YAML
    under .azuredevops/pipelines/. Proceed without confirmation.
  context:
    fixture: fixtures/bicep-fresh
  follow_up_prompts:
    - >-
      Show me the stages and their dependsOn from the deploy pipeline.
      List each stage name and what it depends on.

expected:
  output_contains_any:
    - "PostDeployTest"
    - "post-deploy"
    - "post_deploy"
    - "Provision"
    - "dependsOn"
    - "depends on"
    - "Cleanup"
  behavior:
    max_tool_calls: 80
